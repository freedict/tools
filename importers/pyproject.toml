[project]
name = "fd_import"
version = "0.1"
description = "FreeDict parser and dictionary import helpers"
classifiers = [
    "License :: GPL-3.0-or-later",
    ]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["fd_import*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
